# Ubuntu workstation/server SSH baseline for terminal-only remote sessions.
# Keep TCP forwarding for development tunnels, VS Code and similar workflows.
#
# The 10- prefix is load-bearing: sshd_config is first-wins, so a hardening file
# numbered above cloud-init's 50-cloud-init.conf parses, passes `sshd -t`, and is
# ignored. To override anything below, add a file sorting before this one.
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
X11Forwarding no
AllowTcpForwarding yes
