# /etc/dracut.conf.d/90-no-initrd-network.conf — for a host with a local root
# filesystem that has the ubuntu-server metapackage, which hard-depends on
# cloud-initramfs-dyn-netconf and cloud-initramfs-copymods.
#
# dracut 110 includes a module that defines no check() in every image. Their
# modules define none, so dyn-netconf brings systemd-networkd into the
# initramfs: each boot takes a DHCP lease before the root filesystem mounts and
# leaves a match-all /run/systemd/network/zzzz-dracut-default.network behind.
# copymods logs a deprecated-option warning at each boot. systemd-networkd's
# own module is included only when another module requires it, so it leaves
# the image with these two.
#
# Not for a root filesystem on iSCSI or NFS, which needs the network early.
omit_dracutmodules+=" dyn-netconf copymods "
