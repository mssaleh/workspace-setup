# Kernel limits for a workstation running editors, file watchers and several
# coding agents at once.
#
# Ubuntu's defaults are sized for a general-purpose desktop: 65536 watches and
# 128 instances per user. An editor indexing a large tree, a bundler in watch
# mode, and two or three agent sessions reach both. The failure is quiet — a
# watcher that stops noticing changes rather than one that reports an error —
# so the limits are raised well past the point of contention instead of just
# past the current peak.
#
# Each watch costs roughly 1 KB of unswappable kernel memory, so the watch
# ceiling here is about 1 GB on a machine with 61 GB.
fs.inotify.max_user_watches = 1048576
fs.inotify.max_user_instances = 1024

# With 61 GB of RAM against 8 GB of swap, the default of 60 moves pages out
# while the page cache still has room. Keep swap for genuine pressure.
vm.swappiness = 10

# Apply without rebooting:  sudo sysctl --system
# Revert: delete this file, then `sudo sysctl --system`.
