# Kernel limits for a workstation running editors, file watchers and several
# coding agents at once. Ubuntu's defaults — 65536 watches (set by localsearch,
# not the kernel) and 128 instances — are reached by an editor indexing a large
# tree plus a few agent sessions, and the failure is quiet: a watcher stops
# noticing changes rather than reporting an error.
#
# Each watch pins ~1 KB of unswappable kernel memory, so the ceiling scales with
# RAM instead of being a constant. ${INOTIFY_WATCHES} is one watch per 64 KB of
# RAM, substituted at install time — see the README. Instances cost a file
# descriptor rather than pinned pages, so 1024 is flat.
fs.inotify.max_user_watches = ${INOTIFY_WATCHES}
fs.inotify.max_user_instances = 1024

# sysctl.d is last-wins across all its directories, so anything at 70- or above
# beats this. Check `sysctl fs.inotify.max_user_watches`, not the file.
#
# Apply without rebooting:  sudo sysctl --system
# Revert: delete this file, then `sudo sysctl --system`.
