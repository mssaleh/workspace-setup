# ~/.tmux.conf — byte-identical on every machine (like ~/.zshrc).
# Used mainly by `ds <host>` (mosh + tmux new -A -s main) for durable remote
# sessions. Goal: coding-agent TUIs (Claude Code fullscreen, codex) receive
# real mouse + extended keys through tmux, and anything copied inside tmux
# reaches the local clipboard via OSC 52 (tmux -> mosh/ssh -> kitty).

# Mouse: tmux owns the outer terminal's mouse and forwards events to the
# pane's app when that app asked for mouse reporting (Claude Code fullscreen
# does). In plain panes the wheel scrolls tmux history (copy-mode), and
# releasing a mouse selection copies it.
set -g mouse on

# OSC 52 clipboard: tmux copy-mode selections and trusted programs in panes
# (including coding agents) can write to the local system clipboard. `on` is
# required for pane applications; `external` would allow only tmux itself.
# The two exact outer terminal names cover kitty directly and `ds` via Mosh.
set -s set-clipboard on
set -as terminal-features ',xterm-kitty:RGB:clipboard:extkeys'
set -as terminal-features ',xterm-256color:RGB:clipboard:extkeys'

# Required for kitty graphics previews and terminal notifications from trusted
# TUIs. OSC 52 itself is handled by tmux above, not by this raw path.
set -g allow-passthrough on

# Extended keys and focus events let modern TUIs distinguish modified keys and
# pause/redraw correctly when the pane loses focus.
set -s extended-keys on
set -g focus-events on

# Long agent/build output.
set -g history-limit 100000

# Truecolor through tmux (Catppuccin themes, agent UIs).
set -g default-terminal "tmux-256color"
