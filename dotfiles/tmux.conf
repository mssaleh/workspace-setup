# ~/.tmux.conf — byte-identical on every machine (like ~/.zshrc).
# Used mainly by `ds <host>` (mosh + tmux new -A -s main) for durable remote
# sessions. Goal: coding-agent TUIs (Claude Code fullscreen, codex) receive
# real mouse + extended keys through tmux, and anything copied inside tmux
# reaches the local clipboard via OSC 52 (tmux -> mosh/ssh -> kitty).

# Mouse: tmux owns the outer terminal's mouse and forwards events to the
# pane's app when that app asked for mouse reporting (Claude Code fullscreen
# does). In plain panes the wheel scrolls tmux history (copy-mode), and
# releasing a mouse selection copies it.
set -g mouse on

# OSC 52 clipboard, both directions tmux supports:
#   - tmux copy-mode selections are pushed to the system clipboard
#   - apps inside tmux may set the clipboard (Claude Code "copy to clipboard")
# The clipboard terminal-feature is forced because the outer TERM under
# mosh/ssh is xterm-256color, whose terminfo lacks the Ms capability.
set -s set-clipboard on
set -as terminal-features ',xterm*:clipboard'

# Let apps' raw escape sequences kitty understands pass through (OSC 52,
# notifications/progress).
set -g allow-passthrough on

# Extended keyboard protocol so TUIs can tell Shift+Enter from Enter etc.
# (Claude Code uses this; kitty supports it on the outer end.)
set -s extended-keys on
set -as terminal-features ',xterm*:extkeys'

# Long agent/build output.
set -g history-limit 100000

# Truecolor through tmux (Catppuccin themes, agent UIs).
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm*:Tc'
