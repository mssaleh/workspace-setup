# ============================================================================
#  platform-macos.conf  —  installed as ~/.config/kitty/platform.conf on macOS.
#  Included from kitty.conf. Holds everything whose correct value depends on
#  the platform: the keymap's base modifier, font size, window chrome, and the
#  macos_* options.
#
#  Mental model (matches Wave Terminal so muscle memory transfers):
#     Cmd         -> tabs, app-level, and CREATE splits
#     Ctrl+Shift  -> move BETWEEN / act ON splits, and terminal actions
# ============================================================================

# ---- Font size -------------------------------------------------------------
# Larger than the Linux layer's 11: a Retina panel's higher device-pixel
# density makes the same point size read smaller than it does on a 4K desktop
# display at a fractional scale.
font_size 14.0

# ---- Window sizing ---------------------------------------------------------
# Fixed default OS-window size: 142 columns x 44 rows. The "c" suffix means
# cells (cols/rows) instead of pixels; remember_window_size must be no to apply.
remember_window_size    no
initial_window_width    142c
initial_window_height   44c

# ---- Tab bar ---------------------------------------------------------------
tab_bar_style       powerline
tab_powerline_style slanted

# ---- macOS -----------------------------------------------------------------
macos_option_as_alt          yes
# Full native macOS title bar: traffic-light buttons (close/min/zoom), draggable
# bar, and the window title (which the shell sets to "<machine>: <dir>"). Shown
# in both the title bar and the menu bar so the active machine is always visible.
hide_window_decorations      no
macos_titlebar_color         background
macos_show_window_title_in   all
macos_traditional_fullscreen no
macos_quit_when_last_window_closed no
macos_colorspace             srgb

# ============================================================================
#  Keymaps
# ============================================================================

# ---- Tabs ------------------------------------------------------------------
# --cwd=oldest = the LOCAL shell's directory. (new_tab_with_cwd / --cwd=current
# would, inside a `ks` ssh session, make the new tab re-SSH into the remote at
# the same path — not what we want; a new tab should be a fresh LOCAL shell.
# To open a tab back on the remote, just run `ks <host>` again.)
map cmd+t          launch --type=tab --cwd=oldest
map cmd+shift+w    close_tab
map cmd+1          goto_tab 1
map cmd+2          goto_tab 2
map cmd+3          goto_tab 3
map cmd+4          goto_tab 4
map cmd+5          goto_tab 5
map cmd+6          goto_tab 6
map cmd+7          goto_tab 7
map cmd+8          goto_tab 8
map cmd+9          goto_tab 9
map cmd+]          next_tab
map cmd+[          previous_tab
map ctrl+tab       next_tab
map ctrl+shift+tab previous_tab
map cmd+shift+]    move_tab_forward
map cmd+shift+[    move_tab_backward
map cmd+shift+.    set_tab_title

# ---- Splits / windows: create ----------------------------------------------
# All use --cwd=oldest (the LOCAL shell's dir) so a new split/window is always a
# fresh LOCAL shell, never an auto-reconnect into a `ks` ssh session.
map cmd+n       launch --cwd=oldest
map cmd+shift+n launch --type=os-window --cwd=oldest
map cmd+d       launch --location=vsplit --cwd=oldest
map cmd+shift+d launch --location=hsplit --cwd=oldest
map cmd+w       close_window_with_confirmation ignore-shell
map cmd+enter   toggle_maximized
map cmd+ctrl+f  toggle_fullscreen
# Spawn Claude Code in a split to the right of the current pane (runs LOCALLY):
map cmd+shift+a launch --location=vsplit --cwd=oldest --title Claude claude

# ---- Splits / windows: navigate & arrange ----------------------------------
map ctrl+shift+h     neighboring_window left
map ctrl+shift+j     neighboring_window bottom
map ctrl+shift+k     neighboring_window top
map ctrl+shift+l     neighboring_window right
map ctrl+shift+left  neighboring_window left
map ctrl+shift+down  neighboring_window bottom
map ctrl+shift+up    neighboring_window top
map ctrl+shift+right neighboring_window right
# Zoom / unzoom the active pane, cycle layouts, and enter resize mode.
map cmd+m            toggle_layout stack
map ctrl+shift+backslash next_layout
map ctrl+shift+r     start_resizing_window
map cmd+ctrl+h       move_window left
map cmd+ctrl+j       move_window bottom
map cmd+ctrl+k       move_window top
map cmd+ctrl+l       move_window right

# ---- Scrollback & command output -------------------------------------------
# Browse/search full scrollback.
map cmd+f           show_scrollback
map ctrl+shift+g    show_last_command_output
map shift+page_up   scroll_page_up
map shift+page_down scroll_page_down
# Jump to the previous/next shell prompt.
map ctrl+shift+z    scroll_to_prompt -1
map ctrl+shift+x    scroll_to_prompt 1

# ---- Hints (grab paths / urls / hashes into clipboard or terminal) ---------
map ctrl+shift+p>f kitten hints --type path --program -
map ctrl+shift+p>u kitten hints --type url --program default
map ctrl+shift+p>h kitten hints --type hash --program @
map ctrl+shift+p>w kitten hints --type word --program @
map ctrl+shift+e   open_url_with_hints

# ---- Sessions, config, palette ---------------------------------------------
# Snapshot the current layout, reload this config, and open searchable actions.
map cmd+shift+s save_as_session
map cmd+shift+r load_config_file
map cmd+shift+p command_palette
map cmd+k       clear_terminal to_cursor active

# ============================================================================
#  CHEATSHEET (macOS)
#  Tabs:     Cmd+T new · Cmd+1..9 go · Cmd+[ / ] prev/next · Cmd+Shift+W close
#  Splits:   Cmd+D right · Cmd+Shift+D down · Cmd+W close · Cmd+M zoom
#  Move:     Ctrl+Shift+H/J/K/L focus · Cmd+Ctrl+H/J/K/L move · Ctrl+Shift+R resize
#  Layout:   Ctrl+Shift+\ cycle · Cmd+Enter maximize · Cmd+Ctrl+F fullscreen
#  Output:   Cmd+F scrollback · Ctrl+Shift+G last output · Ctrl+Shift+Z/X prompts
#  Claude:   Cmd+Shift+A open Claude Code in a split
#  OS win:   Cmd+Shift+N new OS window · Cmd+` / Cmd+Shift+` cycle kitty windows (macOS native)
#  New tab/split = LOCAL shell (won't auto-reconnect ssh; run `ks <host>` to go remote)
#  Misc:     Cmd+Shift+S save session · Cmd+Shift+P palette · Cmd+Shift+R reload
# ============================================================================
