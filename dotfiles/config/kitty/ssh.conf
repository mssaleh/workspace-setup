# ssh.conf — config for the kitty ssh kitten (used via `kitten ssh <host>` or
# the `ks <host>` zsh helper).
# The ssh kitten auto-copies xterm-kitty terminfo + shell integration to the
# remote, so prompts, cwd reporting, notifications and TUIs "just work" on SSH.
# Plain `ssh` and the `s` helper intentionally use xterm-256color for broad
# compatibility with hosts that do not have xterm-kitty terminfo installed.
# Docs: https://sw.kovidgoyal.net/kitty/kittens/ssh/

# ---- Defaults for every host ----
shell_integration enabled
# Reuse SSH connections (ControlMaster) so new sessions to the same host are instant:
share_connections yes

# Apply your local theme's fg/bg to the remote kitty (optional; uncomment):
# color_scheme current-theme.conf

# ---- Per-host examples — copy, uncomment and edit ----
#
# hostname prod-*
#     interpreter sh
#     env EDITOR=vim
#     # Push specific dotfiles to these hosts (paths are relative to $HOME):
#     copy .config/starship.toml
#
# hostname legacy.example.com
#     # This box can't run the kitten — transparently fall back to plain ssh:
#     delegate ssh
#
# hostname trusted-dev.local
#     # DANGER: lets the remote host fully control your LOCAL kitty.
#     # Only ever enable for hosts you completely trust.
#     forward_remote_control yes
