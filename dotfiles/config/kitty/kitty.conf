# ============================================================================
#  kitty.conf  —  tuned for SSH, coding agents (Claude Code), and using the
#  terminal as a primary UI (window management without the GUI).
#  Reference docs: https://sw.kovidgoyal.net/kitty/conf/
# ----------------------------------------------------------------------------
#  This file holds only what is true on BOTH macOS and Linux. Everything whose
#  correct value depends on the platform — the modifier the keymap is built on,
#  the font size, the window chrome, and the OS-specific options — lives in
#  platform.conf, which stage_dotfiles.sh installs from either
#  platform-macos.conf or platform-linux.conf.
#
#  In particular there are NO `map` lines here. The two platforms disagree on
#  the base modifier (Cmd on macOS, Ctrl+Shift on Linux, because GNOME Shell
#  grabs Super and a terminal cannot give away Meta), which makes the keymaps
#  disjoint rather than overlapping. Splitting them by file keeps one owner per
#  binding instead of a base map plus a pile of per-platform overrides.
#
#  Reload live at any time and open the searchable action list from the
#  keymap in platform.conf; a cheatsheet is at the bottom of that file.
# ============================================================================

# ---- Theme (Catppuccin Mocha) ----------------------------------------------
include current-theme.conf

# ---- Platform layer (keymap, font size, window chrome, OS options) ---------
# Installed by the setup; see platform-macos.conf / platform-linux.conf.
include platform.conf

# ---- Fonts -----------------------------------------------------------------
# JetBrainsMono Nerd Font Mono (NFM variant — single-width icons, keeps
# yazi/lazygit grid alignment). The setup script installs only the *NerdFontMono-*
# TTFs; the NF (double-width) and NFP (proportional) variants are skipped.
# font_size is platform-specific and lives in platform.conf.
font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# Keep ligatures, but disable them only in the cell under the cursor so you can
# edit inside things like ==> and != cleanly:
disable_ligatures cursor
# `platform` is kitty's default and means "render as close to native for the
# host platform as possible" — CoreText-like on macOS, FreeType on Linux. It is
# stated explicitly here only so a future edit does not mistake it for unset.
text_composition_strategy platform
# modify_font cell_height 108%   # uncomment for a little more line spacing

# ---- Cursor ----------------------------------------------------------------
cursor_shape                 block
cursor_blink_interval        0

# ---- Scrollback (large, for long agent / build output) ---------------------
scrollback_lines               100000
scrollback_pager_history_size  50

# ---- Mouse & links ---------------------------------------------------------
mouse_hide_wait       3.0
detect_urls           yes
url_style             curly
open_url_with         default
underline_hyperlinks  hover
# Select = copied, no menu needed. When a TUI has grabbed the mouse (Claude
# Code, etc.), hold Shift while selecting to force a kitty-native selection —
# copy_on_select applies to that too.
copy_on_select        yes
strip_trailing_spaces smart
focus_follows_mouse   no
# OSC 52 clipboard: let coding agents and other programs (including over
# SSH/tmux) copy results to your clipboard. Remote *reads* stay explicitly
# confirmation-gated (the *-ask values) because they can expose secrets.
clipboard_control     write-clipboard write-primary read-clipboard-ask read-primary-ask

# ---- Bell & notifications (know when an agent / build finishes) ------------
enable_audio_bell    no
visual_bell_duration 0
window_alert_on_bell yes
bell_on_tab          ""

# ---- Performance -----------------------------------------------------------
sync_to_monitor yes
repaint_delay   8
input_delay     3

# ---- Window layout & appearance --------------------------------------------
# Window sizing and the tab bar style are platform-specific (platform.conf).
enabled_layouts         splits,stack,tall,fat,grid

window_padding_width    8
window_border_width     1.5pt
draw_minimal_borders    yes
inactive_text_alpha     0.8
confirm_os_window_close -1
close_on_child_death     yes
allow_cloning           ask
background_opacity      1.0

# Notify only when a command took long enough to matter and this OS window is
# not currently visible. The notification is cleared automatically when the
# window regains focus, so long builds and coding agents do not need polling.
notify_on_cmd_finish invisible 15.0

# ---- Tab bar (your "window list") ------------------------------------------
tab_bar_edge        top
tab_bar_min_tabs    2
tab_title_template  "{index}: {title}"

# ---- Shell integration -----------------------------------------------------
# `no-title` hands window/tab title control to the shell so its precmd can show
# "<machine>: <dir>" (see ~/.zshrc); everything else (cwd reporting, prompt
# marks for jump-to-prompt, completions) stays on.
shell_integration enabled no-title

# ---- Remote control (script window layouts with `kitten @ ...`) ------------
allow_remote_control socket-only
listen_on            unix:/tmp/mykitty

# ---- Startup: single clean window (no forced session) ----------------------
