# ============================================================================
#  platform-linux.conf  —  installed as ~/.config/kitty/platform.conf on Linux.
#  Included from kitty.conf. Holds everything whose correct value depends on
#  the platform: the keymap's base modifier, font size, and window chrome.
#
#  Mental model (the Linux/GNOME equivalent of the macOS layer):
#     Ctrl+Shift      -> tabs, app-level, CREATE splits, terminal actions
#     Ctrl+Alt        -> move BETWEEN splits
#     Ctrl+Shift+Alt  -> act ON splits (move them), and the rarer app actions
#
#  Why not Cmd, like the macOS layer? kitty accepts `cmd+` on Linux — it is a
#  documented alias for Super — so those bindings load without a warning and
#  then never fire, because GNOME Shell grabs Super first: Super alone opens
#  the Activities overview (org.gnome.mutter overlay-key), Super+1..9 launch
#  dock favourites (org.gnome.shell.keybindings switch-to-application-N), and
#  Super+Tab switches applications. Ctrl+Shift is both kitty's own default on
#  Linux and the GNOME Terminal convention, and unlike Alt it does not shadow
#  Meta, which readline and every TUI use for word motion (Alt+B / Alt+F).
# ============================================================================

# ---- Font size -------------------------------------------------------------
# GNOME's monospace-font-name here is 11. JetBrains Mono has a smaller x-height
# than Ubuntu Sans Mono, so 12 is what actually reads as the same size next to
# the rest of the desktop. (The macOS layer uses 15 for a Retina panel.)
font_size 12.0

# ---- Window sizing ---------------------------------------------------------
# GNOME applications restore their previous geometry, so let kitty do the same
# instead of forcing a fixed size on every launch. initial_window_* then only
# applies to the very first run, before there is a remembered size.
remember_window_size    yes
initial_window_width    142c
initial_window_height   44c

# ---- Window decorations ----------------------------------------------------
# Mutter does not implement zxdg_decoration_manager_v1, so it never offers
# server-side decorations to a Wayland client. kitty asks for them, is refused,
# and falls back to drawing its own title bar. `system` makes that title bar
# follow the desktop's colours (Yaru / prefer-dark / accent) instead of sitting
# at a fixed shade, which is the difference between "a GTK app" and "obviously
# not a GTK app" at a glance.
#
# Note: do NOT set `linux_display_server x11` to get a real Mutter-drawn title
# bar instead. The upstream kitty build's X11 backend needs libxcb-xkb.so.1 and
# libxkbcommon-x11.so.0, which a default Ubuntu desktop does not ship, so it
# fails at dlopen. Even repaired it would be a downgrade: the Wayland backend
# supports wp_fractional_scale_v1, which is what a fractional display scale
# needs to stay sharp.
hide_window_decorations no
wayland_titlebar_color  system

# ---- Tab bar ---------------------------------------------------------------
# Flat separators rather than slanted powerline arrows: closer to the Adwaita
# tabs used by GNOME Console/Ptyxis, and legible without the Nerd Font glyphs.
tab_bar_style       separator
tab_separator       " ┇ "

# ============================================================================
#  Keymaps
# ============================================================================

# ---- Tabs ------------------------------------------------------------------
# --cwd=oldest = the LOCAL shell's directory. (new_tab_with_cwd / --cwd=current
# would, inside a `ks` ssh session, make the new tab re-SSH into the remote at
# the same path — not what we want; a new tab should be a fresh LOCAL shell.
# To open a tab back on the remote, just run `ks <host>` again.)
map ctrl+shift+t          launch --type=tab --cwd=oldest
# close_tab deliberately avoids kitty's default Ctrl+Shift+Q, which is `quit`
# and would take every window with it.
map ctrl+shift+alt+w      close_tab
map ctrl+shift+1          goto_tab 1
map ctrl+shift+2          goto_tab 2
map ctrl+shift+3          goto_tab 3
map ctrl+shift+4          goto_tab 4
map ctrl+shift+5          goto_tab 5
map ctrl+shift+6          goto_tab 6
map ctrl+shift+7          goto_tab 7
map ctrl+shift+8          goto_tab 8
map ctrl+shift+9          goto_tab 9
map ctrl+shift+right      next_tab
map ctrl+shift+left       previous_tab
map ctrl+tab              next_tab
map ctrl+shift+tab        previous_tab
map ctrl+shift+period     move_tab_forward
map ctrl+shift+comma      move_tab_backward
map ctrl+shift+alt+t      set_tab_title

# ---- Splits / windows: create ----------------------------------------------
# All use --cwd=oldest (the LOCAL shell's dir) so a new split/window is always a
# fresh LOCAL shell, never an auto-reconnect into a `ks` ssh session.
map ctrl+shift+enter      launch --cwd=oldest
map ctrl+shift+n          launch --type=os-window --cwd=oldest
map ctrl+shift+d          launch --location=vsplit --cwd=oldest
map ctrl+shift+alt+d      launch --location=hsplit --cwd=oldest
map ctrl+shift+w          close_window_with_confirmation ignore-shell
map ctrl+shift+alt+m      toggle_maximized
map ctrl+shift+f11        toggle_fullscreen
# Spawn Claude Code in a split to the right of the current pane (runs LOCALLY):
map ctrl+shift+a          launch --location=vsplit --cwd=oldest --title Claude claude

# ---- Splits / windows: navigate & arrange ----------------------------------
# Ctrl+Alt rather than the macOS layer's Ctrl+Shift, because Ctrl+Shift is the
# tab/app modifier here and Ctrl+Shift+L/N/T are already spoken for above.
map ctrl+alt+h            neighboring_window left
map ctrl+alt+j            neighboring_window bottom
map ctrl+alt+k            neighboring_window top
map ctrl+alt+l            neighboring_window right
map ctrl+alt+left         neighboring_window left
map ctrl+alt+down         neighboring_window bottom
map ctrl+alt+up           neighboring_window top
map ctrl+alt+right        neighboring_window right
map ctrl+shift+m          toggle_layout stack     # zoom / unzoom the active pane
map ctrl+shift+backslash  next_layout             # cycle splits/stack/tall/fat/grid
map ctrl+shift+r          start_resizing_window   # then arrows/hjkl, Enter/Esc to end
map ctrl+shift+alt+h      move_window left
map ctrl+shift+alt+j      move_window bottom
map ctrl+shift+alt+k      move_window top
map ctrl+shift+alt+l      move_window right

# ---- Scrollback & command output -------------------------------------------
map ctrl+shift+f    show_scrollback           # browse/search full scrollback
map ctrl+shift+g    show_last_command_output
map shift+page_up   scroll_page_up
map shift+page_down scroll_page_down
map ctrl+shift+z    scroll_to_prompt -1       # jump to previous shell prompt
map ctrl+shift+x    scroll_to_prompt 1        # jump to next shell prompt

# ---- Hints (grab paths / urls / hashes into clipboard or terminal) ---------
map ctrl+shift+p>f kitten hints --type path --program -
map ctrl+shift+p>u kitten hints --type url --program default
map ctrl+shift+p>h kitten hints --type hash --program @
map ctrl+shift+p>w kitten hints --type word --program @
map ctrl+shift+e   open_url_with_hints

# ---- Sessions, config, palette ---------------------------------------------
map ctrl+shift+alt+s save_as_session   # snapshot current layout to a session file
map ctrl+shift+f5    load_config_file  # reload this config live
# Ctrl+Shift+P is the hints prefix above, so the palette takes the Alt variant.
map ctrl+shift+alt+p command_palette   # searchable list of every action
# Overrides kitty's default Ctrl+Shift+K (scroll_line_up); this mirrors Cmd+K.
map ctrl+shift+k     clear_terminal to_cursor active

# ============================================================================
#  CHEATSHEET (Linux / GNOME)
#  Tabs:     Ctrl+Shift+T new · Ctrl+Shift+1..9 go · Ctrl+Shift+←/→ prev/next
#            Ctrl+Shift+Alt+W close tab · Ctrl+Shift+,/. move tab
#  Splits:   Ctrl+Shift+D right · Ctrl+Shift+Alt+D down · Ctrl+Shift+Enter new
#            Ctrl+Shift+W close · Ctrl+Shift+M zoom
#  Move:     Ctrl+Alt+H/J/K/L focus · Ctrl+Shift+Alt+H/J/K/L move
#            Ctrl+Shift+R resize
#  Layout:   Ctrl+Shift+\ cycle · Ctrl+Shift+Alt+M maximize · Ctrl+Shift+F11 fullscreen
#  Output:   Ctrl+Shift+F scrollback · Ctrl+Shift+G last output · Ctrl+Shift+Z/X prompts
#  Claude:   Ctrl+Shift+A open Claude Code in a split
#  OS win:   Ctrl+Shift+N new OS window
#  New tab/split = LOCAL shell (won't auto-reconnect ssh; run `ks <host>` to go remote)
#  Misc:     Ctrl+Shift+Alt+S save session · Ctrl+Shift+Alt+P palette
#            Ctrl+Shift+F5 reload · Ctrl+Shift+K clear
# ============================================================================
